<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Agent World</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Cpath d='M8 11H34V19H38V23H34V31H31.5V27H30V31H27.5V27H14.5V31H12V27H10.5V31H8V23H4V19H8Z' fill='%23D77757'/%3E%3Crect x='11.75' y='14.6' width='2.8' height='4.6' fill='%2309090B'/%3E%3Crect x='27.45' y='14.6' width='2.8' height='4.6' fill='%2309090B'/%3E%3C/svg%3E"
    />
    <!-- 홈 화면에 앱으로 설치할 수 있게. 매니페스트 안의 아이콘 주소(/icon-*.png)는 서버가 따로 내준다. -->
    <link rel="manifest" href="./app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./app/icon-180.png" />
    <meta name="theme-color" content="#7cc4f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agent World" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-theme="day">
    <div id="world"></div>

    <header id="topbar" class="glass">
      <button id="btn-roster" class="btn icon" type="button" title="에이전트 목록" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
      </button>
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">Agent World</span></div>
      <div id="chips" role="group" aria-label="상태별 에이전트 수"></div>
      <div class="spacer"></div>
      <span id="conn" class="conn" data-state="wait">연결 중…</span>
      <button id="btn-usage" class="btn usage" type="button" title="하네스별 요금제와 한도 사용량" aria-haspopup="dialog" aria-expanded="false" hidden></button>
      <button id="btn-build" class="btn" type="button" title="새 스페이스(집)를 만들고 에이전트를 들입니다 (B)" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>집 짓기
      </button>
      <button id="btn-next" class="btn accent" type="button" title="확인할 에이전트로 차례로 이동 (N)">
        다음 확인 <b id="next-count">0</b>
      </button>
      <button id="btn-notify" class="btn icon" type="button" title="완료·확인 필요 알림 받기" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 17h13l-1.5-2.2V10.5a5 5 0 0 0-10 0v4.3zM10 20h4" /></svg>
      </button>
      <button id="btn-lang" class="btn icon lang" type="button">EN</button>
      <button id="btn-theme" class="btn icon" type="button"></button>
      <button id="btn-home" class="btn icon" type="button" title="처음 화면으로 — 위치·배율·각도 초기화 (H)">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5 12 5l7.5 6.5M6.5 10.2V19h11v-8.8M10 19v-5h4v5" /></svg>
      </button>
    </header>

    <aside id="roster" class="glass" aria-label="에이전트 목록">
      <div class="sheet-grip" aria-hidden="true"></div>
      <input id="search" type="search" placeholder="이름·스페이스·모델 찾기 ( / )" autocomplete="off" spellcheck="false" />
      <div id="roster-list"></div>
    </aside>

    <aside id="detail" class="glass" aria-label="에이전트 상태" hidden></aside>

    <div id="toasts" aria-live="polite"></div>
    <div id="help"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
