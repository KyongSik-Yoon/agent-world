<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent World</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Cpath d='M8 11H34V19H38V23H34V31H31.5V27H30V31H27.5V27H14.5V31H12V27H10.5V31H8V23H4V19H8Z' fill='%23D77757'/%3E%3Crect x='11.75' y='14.6' width='2.8' height='4.6' fill='%2309090B'/%3E%3Crect x='27.45' y='14.6' width='2.8' height='4.6' fill='%2309090B'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#7cc4f1" />
    <link rel="stylesheet" href="./all/all.css" />
  </head>
  <body data-theme="day">
    <!-- 집·나무·돌의 본. 섬마다 <use> 로 찍는다(web/all/ground.ts). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="tree"><rect class="f-trunk" x="-3" y="-8" width="6" height="12" /><path class="f-t3" d="M-17-6 0-30 17-6Z" /><path class="f-t2" d="M-14-20 0-42 14-20Z" /><path class="f-t1" d="M-10-33 0-52 10-33Z" /><path class="f-t3" d="M0-52 10-33 0-33ZM0-42 14-20 0-20ZM0-30 17-6 0-6Z" opacity=".35" /></g>
        <g id="bush"><path class="f-t2" d="M-13 0-9-12 0-17 10-12 13 0Z" /><path class="f-t1" d="M-9-12 0-17 2-6-7-2Z" /></g>
        <g id="rock"><path class="f-pebble" d="M-9 0-7-9 2-12 9-5 8 0Z" /><path class="f-pebble2" d="M-7-9 2-12 1-4-5-2Z" /></g>
        <g id="house">
          <path class="f-wall" d="M100 235 160 255 160 215 100 195Z" />
          <path class="f-wall2" d="M160 255 210 230 210 190 160 215Z" />
          <path class="roof1" d="M100 195 130 163 180 138 150 170Z" />
          <path class="f-wall" d="M100 195 160 215 130 163Z" />
          <path class="roof2" d="M160 215 130 163 180 138 210 190Z" />
          <path class="f-door" d="M177.5 246.25 190 240 190 216 177.5 222.25Z" />
          <path class="f-pane" d="M118 229 136 235 136 221 118 215Z" />
        </g>
      </defs>
    </svg>
    <header>
      <h1 id="title"></h1>
      <div id="totals"></div>
      <span id="conn" hidden></span>
    </header>
    <main id="grid"></main>
    <div id="cover" hidden></div>
    <dialog id="key-dialog">
      <form id="key-form" method="dialog">
        <h2 id="key-title"></h2>
        <p id="key-help"></p>
        <input id="key-input" type="password" autocomplete="off" spellcheck="false" />
        <p id="key-error"></p>
        <div class="row">
          <button id="key-cancel" type="button"></button>
          <button id="key-ok" type="submit" class="primary"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./all/main.ts"></script>
  </body>
</html>
