# Agent World 를 herdr 플러그인으로 돌리는 매니페스트.
#
# herdr 가 시작할 때 서버를 띄우고(이미 떠 있으면 그대로 둔다), 동작(open·info·restart·stop)으로 브라우저로 열거나 끌 수 있게 한다.
# herdr 에는 동작을 모아 보여 주는 팔레트가 없어서, 사용자가 config.toml 의 [[keys.command]] 로 키를 묶는다(README).
# 서버는 herdr 가 넘겨 주는 HERDR_SOCKET_PATH 의 세션에 붙는다. 설정은 `herdr plugin config-dir kyongsik-yoon.agent-world`
# 가 찍는 폴더의 `env` 파일에 `AGENT_WORLD_LANG=en` 처럼 적는다(scripts/plugin.ts 머리말 참고).

id = "kyongsik-yoon.agent-world"
name = "Agent World"
version = "0.6.53"
min_herdr_version = "0.9.5"
description = "A 3D village for your coding agents: see who is working, done or waiting on you, talk to them, answer prompts and build new workspaces from the browser."
platforms = ["linux", "macos"]

# 설치할 때 한 번: bun 이 있는지 보고 의존성(three, 화면 글꼴 IBM Plex Sans KR·JetBrains Mono)을 받는다. 화면 번들은 서버가 뜰 때 스스로 묶는다.
[[build]]
command = ["sh", "scripts/with-bun.sh", "install", "--production", "--frozen-lockfile"]

# herdr 가 시작할 때마다 한 번. 서버를 떼어 띄워 두고 곧 끝난다 — 같은 세션에 이미 떠 있으면 아무것도 하지 않는다.
[[startup]]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "start"]

[[actions]]
id = "open"
title = "Agent World: open in browser"
description = "Start Agent World if needed and open it in the default browser"
contexts = ["global"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "open"]

[[actions]]
id = "info"
title = "Agent World: show address"
description = "Show where Agent World is running, with keys to open, restart or stop it"
contexts = ["global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin kyongsik-yoon.agent-world --entrypoint info --placement popup --focus"]

[[actions]]
id = "restart"
title = "Agent World: restart"
description = "Stop the running Agent World and start it again (after an update or a config change)"
contexts = ["global"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "restart"]

[[actions]]
id = "stop"
title = "Agent World: stop"
description = "Stop the Agent World server for this herdr session"
contexts = ["global"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "stop"]

# 주소를 보여 주는 작은 팝업. 위의 info 동작이 연다.
[[panes]]
id = "info"
title = "Agent World"
placement = "popup"
width = 76
height = 11
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "info"]
